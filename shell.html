<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://*.sndcdn.com">
  <title>SimpleCloud</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m15 3 6 6-4 1-2 4v3l-2 2-8-8 2-2h3l4-2zM9 15l-5 5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14"/><path class="solid" d="M19 5v14L8 12z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="solid" d="M9 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="solid" d="M7 5h4v14H7zm6 0h4v14h-4z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path class="solid" d="M5 5v14l11-7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2.5 6h4L18 18h2.5"/><path d="M2.5 18h4L18 6h2.5"/><path fill="currentColor" stroke="none" d="M17.6 2.6 22 6l-4.4 3.4z"/><path fill="currentColor" stroke="none" d="M17.6 14.6 22 18l-4.4 3.4z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M3 10v-1a4 4 0 0 1 4-4h13"/><path d="M21 14v1a4 4 0 0 1-4 4H4"/><path fill="currentColor" stroke="none" d="M17.7 3.4 21.5 6l-3.8 2.6z"/><path fill="currentColor" stroke="none" d="M6.3 15.4 2.5 18l3.8 2.6z"/></symbol>
    <symbol id="i-like" viewBox="0 0 24 24"><path d="M12 20 4.5 13a4.5 4.5 0 1 1 7.5-4.7 4.5 4.5 0 1 1 7.5 4.7z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M11 6h9M4 12h16M4 18h16"/><path class="solid" d="M4 3v6l5-3z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M10 17V6l8-2v11M10 9l8-2"/><ellipse cx="7.5" cy="17.5" rx="2.5" ry="1.7"/><ellipse cx="15.5" cy="15.5" rx="2.5" ry="1.7"/></symbol>
    <symbol id="i-listen" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="2.8" y="13.2" width="4.4" height="7" rx="1.7"/><rect x="16.8" y="13.2" width="4.4" height="7" rx="1.7"/></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M3 9.2h18"/><path d="M6.3 6.9h.01M9.1 6.9h.01"/></symbol>
  </svg>
  <header class="header">
    <img class="app-icon" src="assets/cloud.png" alt="SimpleCloud" width="30" height="30" draggable="false">
    <nav aria-label="SoundCloud">
      <button type="button" data-route="home">Home</button>
      <button type="button" data-route="feed">Feed</button>
      <button type="button" data-route="library">Library</button>
      <button type="button" data-route="likes">Favourites</button>
      <button type="button" data-route="profile">Profile</button>
    </nav>
    <form class="search" role="search">
      <button type="submit" title="Search" aria-label="Search"><svg><use href="#i-search"/></svg></button>
      <input type="search" role="combobox" aria-label="Search SoundCloud" aria-autocomplete="list" aria-expanded="false" aria-controls="search-history-list" placeholder="Search SoundCloud" maxlength="200" required>
    </form>
    <button id="pin" type="button" class="icon" title="Always on top" aria-label="Always on top" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
    <button id="mode" type="button" class="mode-button" title="Listening mode (Ctrl+Shift+L)" aria-keyshortcuts="Control+Shift+L"><svg aria-hidden="true"><use href="#i-listen"/></svg>Listen</button>
    <div class="window-actions" role="group" aria-label="Window controls">
      <button type="button" class="icon" data-window="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M9 4v4m6 2v4m-5 2v4"/></svg></button>
      <button type="button" class="icon" data-window="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M6 15h12"/></svg></button>
      <button type="button" class="icon" data-window="maximize" title="Maximize or restore" aria-label="Maximize or restore"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button type="button" class="icon" data-window="close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <section class="history" id="search-history" hidden aria-label="Recent searches">
    <ul class="history-list" id="search-history-list" role="listbox" aria-label="Recent searches"></ul>
    <div class="history-foot">
      <span>Recent searches</span>
      <button type="button" id="search-history-clear">Clear all</button>
    </div>
  </section>
  <main class="site-slot" aria-label="SoundCloud content"></main>
  <aside class="queue" hidden aria-label="Next up">
    <header class="queue-head">
      <h2>Next up</h2>
      <span id="queue-meta"></span>
      <button type="button" id="queue-clear">Clear</button>
      <button type="button" class="icon" id="queue-close" aria-label="Close queue" title="Close queue">×</button>
    </header>
    <ol id="queue-list"></ol>
    <p class="queue-empty" hidden>Nothing queued. Play a playlist or add something with Add to Next up.</p>
  </aside>
  <footer class="player" aria-label="Player">
    <div class="transport" role="group" aria-label="Playback controls">
      <button type="button" class="icon" data-action="previous" title="Previous" aria-label="Previous" disabled><svg><use href="#i-prev"/></svg></button>
      <button type="button" class="icon play" data-action="play" title="Play" aria-label="Play" disabled><svg><use href="#i-play"/></svg></button>
      <button type="button" class="icon" data-action="next" title="Next" aria-label="Next" disabled><svg><use href="#i-next"/></svg></button>
      <button type="button" class="icon secondary-start" data-action="shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false" disabled><svg><use href="#i-shuffle"/></svg></button>
      <button type="button" class="icon" data-action="repeat" title="Repeat" aria-label="Repeat" aria-pressed="false" disabled><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="timeline">
      <span id="elapsed">–:––</span>
      <input id="seek" type="range" aria-label="Playback position" min="0" max="1" value="0" disabled>
      <span id="duration">–:––</span>
    </div>
    <div class="track">
      <div class="cover" aria-hidden="true"><svg><use href="#i-note"/></svg></div>
      <div class="metadata"><span id="artist" hidden></span><span id="track-title">Nothing playing</span></div>
    </div>
    <div class="track-actions" role="group" aria-label="Track controls">
      <button type="button" class="icon" data-action="like" title="Like" aria-label="Like" aria-pressed="false" disabled><svg><use href="#i-like"/></svg></button>
      <button type="button" class="icon listen-only" id="bar-pin" data-action="pin" title="Always on top" aria-label="Always on top" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
      <button type="button" class="icon listen-only" data-action="mode" title="Browser mode" aria-label="Browser mode"><svg><use href="#i-window"/></svg></button>
      <button type="button" class="icon" data-action="queue" title="Next up" aria-label="Next up" aria-expanded="false"><svg><use href="#i-queue"/></svg></button>
    </div>
    <div id="status" role="status"></div>
  </footer>
</body>
</html>
